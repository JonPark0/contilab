name: PR description cleanup

# Removes the "Generated by ..." footer that PR tooling can append to a pull
# request's description (.github/scripts/pr_footer.py). Runs whenever a pull
# request is opened or its description edited; run it by hand to clean every
# existing pull request. Edits made with GITHUB_TOKEN do not trigger it again.
on:
  pull_request:
    types: [opened, edited, reopened]
  workflow_dispatch:

permissions:
  pull-requests: write

concurrency:
  group: pr-footer-${{ github.event.pull_request.number || 'all' }}
  cancel-in-progress: false

jobs:
  clean:
    name: Remove the footer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # pull requests from forks get a read-only token; only same-repository ones
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - name: Clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/pr_footer.py ${PR:+--pr "$PR"}
