[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contilab"
version = "0.1.0"
description = "Performance-first continual learning framework for benchmarking, distillation and consolidation"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "safetensors",
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
contilab = "contilab.runner.cli:main"

[tool.setuptools.packages.find]
include = ["contilab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: requires network access (run with --run-network)"]
