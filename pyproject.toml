[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contilab"
version = "0.2.0"
description = "Performance-first continual learning framework: benchmarks, 30+ metrics, distillation and model merging for vision and LLMs (PyTorch)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yeochoon Park" }]
requires-python = ">=3.11"
keywords = [
    "continual-learning", "lifelong-learning", "incremental-learning", "catastrophic-forgetting",
    "class-incremental", "benchmark", "evaluation-metrics", "knowledge-distillation", "model-merging",
    "task-arithmetic", "ties-merging", "lora", "llm", "pytorch", "vmap",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "safetensors",
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/JonPark0/contilab"
Documentation = "https://github.com/JonPark0/contilab/wiki"
Issues = "https://github.com/JonPark0/contilab/issues"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
contilab = "contilab.runner.cli:main"

[tool.setuptools.packages.find]
include = ["contilab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: requires network access (run with --run-network)"]
