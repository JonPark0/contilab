# In-session CPU empirical study (§4.1 cpu column).
defaults:
  engine: {device: auto, compile: auto, precision: auto, max_E: 8}
  model: {name: mlp, hidden: 400, depth: 2}
  optim: {name: sgd, lr: 0.03}
  train: {epochs: 1, batch_size: 32, eval_batch_size: 512}
  metrics: {tier: extended}
  consolidate: {M: 500}
presets:
  split_mnist_class:
    benchmark: {name: split_mnist, scenario: class}
    metrics: {tier: full}
  split_mnist_task:
    benchmark: {name: split_mnist, scenario: task}
  permuted_mnist:
    benchmark: {name: permuted_mnist, scenario: domain, n_tasks: 10, n_train: 10000, n_test: 2000}
  split_cifar10_class:
    benchmark: {name: split_cifar10, scenario: class}
    model: {name: resnet18r, nf: 20}
    train: {epochs: 3}
  text5_class:
    benchmark: {name: text5, scenario: class, n_train: 2000, n_test: 500, max_len: 128, tokenizer: EleutherAI/pythia-70m}
    model: {name: hf, hf_name: EleutherAI/pythia-70m}
    optim: {name: adamw, lr: 0.0001}
    train: {batch_size: 16, eval_batch_size: 64}
    consolidate: {M: 200}
