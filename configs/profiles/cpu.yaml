# In-session CPU empirical study (§4.1 cpu column).
defaults:
  # bench (4 CPUs, AMX): MLP fp32 eager vmap E=8 = 40.7k samples/s (3.8x E=1; bf16 28.6k, compiled 31-37k);
  # ResNet: vmap gives nothing, bf16+compile = 730/s vs fp32 eager 318/s
  engine: {device: auto, compile: "off", precision: fp32, max_E: 8}
  model: {name: mlp, hidden: 400, depth: 2}
  optim: {name: sgd, lr: 0.03}
  train: {epochs: 1, batch_size: 32, eval_batch_size: 512}
  metrics: {tier: extended, rho: 20}  # ρ ≤ WF window Δ (10% of a ~300-step MNIST task)
  consolidate: {M: 500}
presets:
  split_mnist_class:
    benchmark: {name: split_mnist, scenario: class}
    metrics: {tier: full}
  split_mnist_task:
    benchmark: {name: split_mnist, scenario: task}
  permuted_mnist:
    benchmark: {name: permuted_mnist, scenario: domain, n_tasks: 10, n_train: 10000, n_test: 2000}
  split_cifar10_class:
    benchmark: {name: split_cifar10, scenario: class}
    model: {name: resnet18r, nf: 20}
    train: {epochs: 2}  # 3 in the spec; lowered to fit the 6 h CPU budget (A-GEM ≈ 1 h/seed at 3 epochs)
    engine: {compile: "on", precision: auto, max_E: 1}
    metrics: {rho: 50}  # ResNet evaluation is expensive; Δ ≈ 56 steps at 2 epochs
  text5_class:
    # n_train 2000 in the spec; 1000 per the plan's budget rule (pythia-70m ≈ 1 s/step on 4 CPU threads)
    benchmark: {name: text5, scenario: class, n_train: 1000, n_test: 500, max_len: 128, tokenizer: EleutherAI/pythia-70m}
    model: {name: hf, hf_name: EleutherAI/pythia-70m}
    optim: {name: adamw, lr: 0.0001}
    train: {batch_size: 16, eval_batch_size: 64}
    engine: {max_E: 1}
    metrics: {rho: 50, stream_subset: 100}
    consolidate: {M: 200}
