# GitHub Pages (Settings → Pages → Deploy from branch: main, folder /docs)
title: contilab
description: >-
  PyTorch framework for continual learning research: benchmark EWC, LwF, experience replay, DER++, A-GEM and
  LoRA against catastrophic forgetting on vision and language models, compare them with model merging (Task
  Arithmetic, TIES) and knowledge distillation, and report 30+ metrics with proper statistics.
url: https://jonpark0.github.io
baseurl: /contilab
# Just the Docs (https://just-the-docs.com), pinned; with the plugins below.
remote_theme: just-the-docs/just-the-docs@v0.12.0
lang: en
author:
  name: Yeochoon Park
  url: https://github.com/JonPark0
defaults:
  - scope:
      path: ""
    values:
      layout: default                     # GitHub Pages adds it by default; explicit for other builds
      image: /assets/social-preview.png   # og:image, twitter:image
  - scope:
      path: google0f5a07030fefb89e.html   # Search Console ownership file
    values:
      sitemap: false
# Search engine ownership checks: Google Search Console uses the HTML file
# docs/google0f5a07030fefb89e.html. For the HTML tag method, or for Bing
# Webmaster Tools, paste the codes below and uncomment; jekyll-seo-tag writes
# the meta tags.
# webmaster_verifications:
#   google: CODE
#   bing: CODE
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
exclude:
  - design/2026-10-22-implementation-plan.md
  - wiki/README.md

# Just the Docs settings
color_scheme: light          # dark mode: _includes/head_custom.html and header_custom.html
search_enabled: true
search:
  heading_level: 3
  previews: 2
  preview_words_before: 5
  preview_words_after: 10
  button: true
heading_anchors: true
enable_copy_code_button: true
back_to_top: true
back_to_top_text: "Back to top"
aux_links:
  "GitHub": "https://github.com/JonPark0/contilab"
  "Releases": "https://github.com/JonPark0/contilab/releases"
  "Wiki": "https://github.com/JonPark0/contilab/wiki"
  "한국어": "/contilab/ko/"
aux_links_new_tab: false
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/JonPark0/contilab"
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree
mermaid:
  version: "11.4.1"          # loaded only where a page sets mermaid: true
callouts:
  note:
    title: Note
    color: blue
